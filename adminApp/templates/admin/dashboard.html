{% extends 'admin/base.html' %}

{% block content %}
    <h1>Bienvenue sur la page de dashboard</h1>
    <p>Ceci est la page du tableau de bord de l'administrateur.</p>

    {% for post in posts %}
      <div>
        <span>{{ post.titulo }}</span>
        <a href="{% url 'editar_post' post.id %}">Editar</a>

        <form method="POST" action="{% url 'deletar_post' post.id %}" style="display:inline"
              onsubmit="return confirm('Tem certeza que quer deletar este post?')">
          {% csrf_token %}
          <button type="submit">Deletar</button>
        </form>
      </div>
    {% endfor %}
{% endblock content %}
