{% extends "geo/base.html" %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  #flood-map {
    width: 100%;
    height: 70vh;
    min-height: 480px;
    border-radius: 8px;
    background: #dde;
  }

  /* Garante que o seletor de camadas (Ruas/Satélite) fique sempre visível
     acima dos overlays de profundidade */
  .leaflet-control-layers {
    z-index: 1000;
  }

  .player-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: #1a2233;
    border-radius: 0 0 8px 8px;
    color: #f0f4f8;
    flex-wrap: wrap;
  }

  .player-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #2c7fb8;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .player-btn:hover { background: #225ea8; }
  .player-btn:disabled { background: #4a5568; cursor: not-allowed; }

  .player-timeline {
    flex: 1 1 240px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 200px;
  }

  .player-slider {
    width: 100%;
    accent-color: #2c7fb8;
  }

  .player-timestamp {
    font-family: 'Courier New', monospace;
    font-size: 0.95em;
    font-weight: 600;
    white-space: nowrap;
  }

  .player-speed {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85em;
  }

  .player-speed select {
    background: #2a3447;
    color: #fff;
    border: 1px solid #3d4a63;
    border-radius: 4px;
    padding: 4px 6px;
  }

  .legend {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85em;
    color: #444;
  }
  .legend-gradient {
    height: 14px;
    width: 220px;
    border-radius: 3px;
    background: linear-gradient(to right, #a8d5e5, #5ab4d6, #2c7fb8, #225ea8, #253494, #1a1a6e, #3d0b5e);
  }
    .map-instructions {
    background: #fff8e1;
    border-left: 4px solid #e6a817;
    padding: 8px 12px;
    font-size: 0.82em;
    line-height: 1.4;
    color: #01001b;
    max-width: 220px;
    border-radius: 4px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.2);
  }
</style>
{% endblock %}

{% block content %}
<div class="container" style="max-width: 1100px; margin: 24px auto;">
  <h2>{{ simulation.name }}</h2>
  {% if simulation.description %}
    <p style="color:#555;">{{ simulation.description }}</p>
  {% endif %}

  <div id="flood-map"></div>

  <div class="player-bar">
    <button id="btn-play" class="player-btn" title="Play/Pause">▶</button>

    <div class="player-timeline">
      <input type="range" id="timeline-slider" class="player-slider" min="0" max="0" value="0" step="1" />
      <span id="timestamp-label" class="player-timestamp">--</span>
    </div>

    <div class="player-speed">
      <label for="speed-select">Velocidade:</label>
      <select id="speed-select">
        <option value="1000">1x</option>
        <option value="600">2x</option>
        <option value="300" selected>4x</option>
        <option value="150">8x</option>
      </select>
    </div>
  </div>

  <div class="legend">
    <span>0 m</span>
    <div class="legend-gradient"></div>
    <span id="legend-max">-- m</span>
    <span style="margin-left:auto; color:#888;">Profundidade da lâmina d'água</span>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  const SIMULATION_ID = {{ simulation.pk }};
  const API_URL = "{% url 'AppRas:simulation_timesteps_api' simulation.pk %}";

  let map = L.map('flood-map');

  // Camadas base disponíveis — igual ao seletor de basemap do RAS Mapper
  const baseLayers = {
    "Ruas": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
    }),
    "Satélite": L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
        maxZoom: 19,
      }
    ),
  };

  // Rótulos (nomes de ruas/cidades) sobrepostos ao satélite, opcional
  const satelliteLabels = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: '' }
  );

  const overlayLayers = {
    "Rótulos (satélite)": satelliteLabels,
  };

  // Inicia no mapa de Satélite (mesmo comportamento de antes)
  baseLayers["Satélite"].addTo(map);
  L.control.layers(baseLayers, overlayLayers, { collapsed: false }).addTo(map);

    // Aviso fixo no canto superior esquerdo do mapa
  const InstructionsControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function () {
      const div = L.DomUtil.create('div', 'map-instructions');
      div.innerHTML =
        '1 - Antes de dar ou tirar zoom, dê pausa primeiro na simulação.<br>' +
        '2 - Se ficar piscando, dê refresh na página (ou aperte F5) e dê play de novo.';
      L.DomEvent.disableClickPropagation(div);
      return div;
    },
  });
  map.addControl(new InstructionsControl());

  let timesteps = [];
  let currentOverlay = null;  // overlay visível agora
  let pendingOverlay = null;  // overlay que está carregando (ainda invisível)
  let currentIndex = 0;
  let isPlaying = false;
  let playTimer = null;

  const slider = document.getElementById('timeline-slider');
  const playBtn = document.getElementById('btn-play');
  const timestampLabel = document.getElementById('timestamp-label');
  const speedSelect = document.getElementById('speed-select');
  const legendMax = document.getElementById('legend-max');

  // Pré-carrega a imagem do próximo frame em background sem mostrar ainda
  const preloadCache = {};
  function preloadFrame(index) {
    if (index < 0 || index >= timesteps.length) return;
    const url = timesteps[index].overlay_url;
    if (url && !preloadCache[url]) {
      const img = new Image();
      img.src = url;
      preloadCache[url] = img;
    }
  }

  function showFrame(index) {
    if (!timesteps.length) return;
    index = Math.max(0, Math.min(index, timesteps.length - 1));
    currentIndex = index;
    const frame = timesteps[index];

    slider.value = index;
    timestampLabel.textContent = frame.label;

    if (!frame.overlay_url || !frame.bounds) return;

    // Cancela qualquer overlay pendente anterior que ainda não terminou de
    // carregar — evita que frames "atrasados" apareçam fora de ordem
    if (pendingOverlay) {
      map.removeLayer(pendingOverlay);
      pendingOverlay = null;
    }

    const newOverlay = L.imageOverlay(frame.overlay_url, frame.bounds, {
      opacity: 0,          // começa invisível
      interactive: false,
    }).addTo(map);

    pendingOverlay = newOverlay;

    // Quando a imagem terminar de carregar, faz a troca sem piscar:
    // 1) torna o novo visível
    // 2) remove o antigo
    newOverlay.getElement()
      ? _swapOverlay(newOverlay)  // já no DOM (cache do browser) — troca imediata
      : newOverlay.once('load', () => _swapOverlay(newOverlay));

    // Pré-carrega os próximos 2 frames em background
    preloadFrame(index + 1);
    preloadFrame(index + 2);
  }

  function _swapOverlay(newOverlay) {
    // Só executa se esse overlay ainda for o pendente (não foi cancelado)
    if (newOverlay !== pendingOverlay) return;
    pendingOverlay = null;
    newOverlay.setOpacity(0.85);
    if (currentOverlay) {
      map.removeLayer(currentOverlay);
    }
    currentOverlay = newOverlay;
  }

  function play() {
    if (isPlaying || timesteps.length < 2) return;
    isPlaying = true;
    playBtn.textContent = '⏸';
    tick();
  }

  function tick() {
    if (!isPlaying) return;
    let next = currentIndex + 1;
    if (next >= timesteps.length) {
      next = 0; // volta ao início (loop), igual ao RAS Mapper
    }
    showFrame(next);
    const delay = parseInt(speedSelect.value, 10);
    playTimer = setTimeout(tick, delay);
  }

  function pause() {
    isPlaying = false;
    playBtn.textContent = '▶';
    if (playTimer) {
      clearTimeout(playTimer);
      playTimer = null;
    }
  }

  playBtn.addEventListener('click', () => {
    isPlaying ? pause() : play();
  });

  slider.addEventListener('input', () => {
    pause();
    showFrame(parseInt(slider.value, 10));
  });

  fetch(API_URL)
    .then((res) => res.json())
    .then((data) => {
      timesteps = data.timesteps || [];

      if (data.bounds) {
        map.fitBounds(data.bounds);
      } else {
        map.setView([-15, -55], 5); // fallback Brasil
      }

      if (data.depth_max) {
        legendMax.textContent = data.depth_max.toFixed(1) + ' m';
      }

      slider.max = Math.max(0, timesteps.length - 1);

      if (timesteps.length > 0) {
        showFrame(0);
      } else {
        timestampLabel.textContent = 'Nenhum timestep processado';
        playBtn.disabled = true;
      }
    })
    .catch((err) => {
      console.error('Erro ao carregar timesteps:', err);
      timestampLabel.textContent = 'Erro ao carregar dados';
    });
})();
</script>
{% endblock %}
