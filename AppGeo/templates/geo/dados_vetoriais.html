<!DOCTYPE html>
{% load static %}
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="{% static 'img/logo_transparente.png' %}"> 
  <title>Eclair Tec</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/dados_vetoriais.css' %}">
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando mapa base…</p>
  </div>

  <header>
    <!--<div class="logo-mark"></div>-->
    <!--<h1>GEO<span>IA</span> — Consultas Inteligentes</h1>-->
    <a href="{% url 'index' %}" class="nav-brand">
      <svg width="50" height="50" color="blue" viewBox="0 0 24 24" fill="none" stroke="#5bc8ff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" class="nav-logo">
          <path d="M21.4 9.3l1-.3-.3-1.2-1 .1a3.8 3.8 0 0 0-.6-.6l.1-1-1.2-.3-.5.9a4 4 0 0 0-.9 0l-.5-.9-1.2.3.1 1a3.8 3.8 0 0 0-.6.6l-1-.1-.3 1.2 1 .3a4 4 0 0 0 0 .9l-1 .3.3 1.2 1-.1c.2.2.4.4.6.6l-.1 1 1.2.3.5-.9a4 4 0 0 0 .9 0l.5.9 1.2-.3-.1-1c.2-.2.4-.4.6-.6l1 .1.3-1.2-1-.3a4 4 0 0 0 0-.9z" stroke-width="1.1"/>
          <path d="M8.5 3.3a5.5 5.5 0 0 0-3 10.1c.6.5 1 1.2 1 2v.1h5v-.1c0-.8.4-1.5 1-2a5.5 5.5 0 0 0-4-10.1z"/>
          <path d="M6.5 17.5h4"/>
          <path d="M7 20h3"/>
      </svg>
      <svg width="140" height="24" viewBox="0 0 140 24">
          <text x="0" y="17" font-family="Arial, sans-serif" font-size="16" font-weight="700"
              fill="none" stroke="#5bc8ff" stroke-width="0.8">
              Eclair Tec
          </text>
      </svg>
  </a>
    <!-- ========================================= Menu ==================================-->
    <nav class="nav-links">
      <div class="blog"><h1><a id="navega" href="{% url 'index' %}" style="color: white; text-decoration: none;">INÍCIO</a></h1></div>
      <div class="blog"><h1><a id="navega" href="{% url 'AppRas:simulation_list' %}" style="color: white; text-decoration: none;">SIMULAÇÕES HIDRÁULICAS</a></h1></div>
      <div class="blog"><h1><a id="navega" href="{% url 'blog' %}" style="color: white; text-decoration: none;">BLOG</a></h1></div>
      <div class="sobre"><h1><a href="{% url 'sobre' %}" style="color: white; text-decoration: none;">SOBRE</a></h1></div>
      <div class="contato"><h1><a href="{% url 'contato' %}" style="color: white; text-decoration: none;">CONTATO</a></h1></div>
    </nav>
    <!-- ========================================= Menu ==================================-->
    <div class="header-right">
      <span id="map-status">mapa base</span>
    </div>
  </header>

  <aside>
    <div id="chat-history">
      <div class="welcome" id="welcome-screen">
        <div class="icon">🗺️</div>
        <h2>Pergunte sobre os municípios</h2>
        <p>O agente consulta o banco IBGE e responde em texto, gráfico e destaca os resultados no mapa.</p>
        <div class="examples">
          <button class="example-btn">Quais os 10 maiores municípios do Brasil por área?</button>
          <button class="example-btn">Mostre os municipios do sul</button>
          <button class="example-btn">Liste os estados do Nordeste</button>
          <button class="example-btn">Mostre os municípios da região de Campinas</button>
          <button class="example-btn">Municípios do MS com área acima de 10.000 km²</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea
          id="question-input"
          placeholder="Ex: Mostre Campinas SP"
          rows="1"
        ></textarea>
        <button id="send-btn" title="Enviar (Enter)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter para enviar · Shift+Enter para nova linha</div>
    </div>
  </aside>

  <div id="map"></div>

<script>window.CARTO_KEY = "{{ carto_key|escapejs }}";</script>
<script src="{% static 'js/dados_vetoriais.js' %}"></script>
</body>
</html>
