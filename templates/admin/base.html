<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', sans-serif; }
    .nav {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 24px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }
    .nav a {
      color: #ccc; text-decoration: none; font-size: 13px;
    }
    .nav a:hover { color: #fff; }
    .nav-logout {
      margin-left: auto;
    }
    .nav-logout button {
      background: none; border: 1px solid #555;
      color: #ccc; padding: 5px 12px; border-radius: 6px;
      font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .nav-logout button:hover { background: #333; color: #fff; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="{% url 'index' %}">Home</a>
    <a href="{% url 'admin_dashboard' %}">Dashboard</a>
    <a href="{% url 'criar_post' %}">Blog</a>
    <a href="{% url 'admin_sobre' %}">Sobre</a>
    <a href="{% url 'admin_mensagens' %}">Mensagens</a>

    {% if user.is_authenticated %}
      <div class="nav-logout">
        <form method="POST" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Sair</button>
        </form>
      </div>
    {% endif %}
  </nav>

  {% block content %}{% endblock %}
</body>
</html>
